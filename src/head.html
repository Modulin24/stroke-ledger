<style>
/* Layout: a yardage-book page. One narrow column, numbers in condensed signage type, tabs docked to the
   bottom edge on a phone and under the header on a wide screen. */
:root{
  --bg:#eef2f0; --surface:#fbfcfb; --sunk:#e3e9e6; --ink:#14201c; --ink2:#3f4e48; --muted:#66756f; --line:#d0d9d5; --line2:#b4c0bb;
  --flag:#f2b705; --flag-ink:#241b00;
  --gain:#2a78d6; --loss:#e34948; --gain-bg:#dce8f9; --loss-bg:#fae0df;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a;
  --z-tee:#14201c; --z-fwy:#8fc79a; --z-rgh:#a9b47c; --z-snd:#e2cf9f; --z-rec:#a58a6c; --z-grn:#55c08a; --z-pen:#8ec3e6; --z-ob:#cfd4d2;
  --font-d:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --font-b:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1412; --surface:#171f1c; --sunk:#202a26; --ink:#e7eeea; --ink2:#bcc8c3; --muted:#8d9c96; --line:#2b3632; --line2:#3d4a45;
    --flag:#f5c518; --flag-ink:#241b00;
    --gain:#3987e5; --loss:#e66767; --gain-bg:#17324f; --loss-bg:#4b2424;
    --c1:#3987e5; --c2:#d95926; --c3:#199e70;
    --z-tee:#e7eeea; --z-fwy:#3f7a4c; --z-rgh:#5e6a38; --z-snd:#9b8757; --z-rec:#6b5540; --z-grn:#2d9463; --z-pen:#34749c; --z-ob:#4a5350;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1412; --surface:#171f1c; --sunk:#202a26; --ink:#e7eeea; --ink2:#bcc8c3; --muted:#8d9c96; --line:#2b3632; --line2:#3d4a45;
  --flag:#f5c518; --flag-ink:#241b00;
  --gain:#3987e5; --loss:#e66767; --gain-bg:#17324f; --loss-bg:#4b2424;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70;
  --z-tee:#e7eeea; --z-fwy:#3f7a4c; --z-rgh:#5e6a38; --z-snd:#9b8757; --z-rec:#6b5540; --z-grn:#2d9463; --z-pen:#34749c; --z-ob:#4a5350;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--font-b);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
h1,h2,h3{font-family:var(--font-d);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.01em}
p{margin:0}
.num{font-family:var(--font-d);font-variant-numeric:tabular-nums;font-weight:600}
.app{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 92px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand svg{flex:none}
.brand h1{font-size:26px;line-height:1;text-transform:uppercase;letter-spacing:.04em}
.top-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.base-pick{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
select,input[type=text],input[type=date],textarea{background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:7px 9px;min-width:0;max-width:100%}
textarea{width:100%;min-height:64px;resize:vertical}
.icon-btn{background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:7px 10px;font-size:13px;font-weight:500}
.icon-btn[aria-pressed=true]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--line2);flex:none}
.sync.ok i{background:var(--c3)} .sync.busy i{background:var(--flag)} .sync.bad i{background:var(--loss)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(7,1fr);
  padding:0 max(6px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(6px,env(safe-area-inset-left,0px))}
.tab{background:none;border:0;padding:14px 2px 12px;font-family:var(--font-d);font-weight:600;font-size:16px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-top:3px solid transparent;margin-top:-1px}
.tab[aria-current=page]{color:var(--ink);border-top-color:var(--flag)}
@media (min-width:760px){
  .app{padding-block:20px 40px}
  .tabs{position:static;border:0;background:none;display:flex;gap:2px;padding:0;border-bottom:1px solid var(--line)}
  .tab{padding:8px 16px 9px;border-top:0;margin:0 0 -1px;border-bottom:3px solid transparent}
  .tab[aria-current=page]{border-bottom-color:var(--flag)}
}
#view{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.h2{font-size:22px;text-transform:uppercase;letter-spacing:.04em}
.h3{font-size:17px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2)}
.sub{font-size:13px;color:var(--muted)}
.note{font-size:13px;color:var(--ink2);background:var(--sunk);border-radius:8px;padding:9px 11px}
.empty{color:var(--muted);padding:18px 4px}
.tag{font:600 11px/1 var(--font-b);font-style:normal;text-transform:uppercase;letter-spacing:.06em;background:var(--flag);color:var(--flag-ink);border-radius:4px;padding:3px 5px}
.tag.alt{background:var(--sunk);color:var(--ink2)}
input[type=file]{font-size:14px;max-width:100%}
.btn{background:var(--ink);color:var(--surface);border:1px solid var(--ink);border-radius:8px;padding:10px 14px;font-weight:600}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line2)}
.btn.flag{background:var(--flag);color:var(--flag-ink);border-color:var(--flag)}
.btn.danger{color:var(--loss);border-color:var(--loss)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btnrow .grow{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{background:var(--surface);border:1px solid var(--line2);border-radius:999px;padding:6px 11px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
.chip[aria-pressed=true]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.liedot{width:10px;height:10px;border-radius:50%;flex:none;border:1px solid var(--line2)}
.z-tee{background:var(--z-tee)} .z-fwy{background:var(--z-fwy)} .z-rgh{background:var(--z-rgh)} .z-snd{background:var(--z-snd)} .z-rec{background:var(--z-rec)} .z-grn{background:var(--z-grn)} .z-pen{background:var(--z-pen)} .z-ob{background:var(--z-ob)} .z-hole{background:var(--flag)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{background:var(--surface);border:0;border-right:1px solid var(--line2);padding:6px 11px;font-size:14px;font-weight:500}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--surface)}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.f{display:flex;flex-direction:column;gap:4px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;min-width:0}
.f > input,.f > select,.f > textarea{font-size:15px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink)}
.sgc{font-family:var(--font-d);font-variant-numeric:tabular-nums;font-weight:600;font-size:16px;padding:1px 7px;border-radius:5px;color:var(--ink);background:var(--sunk);white-space:nowrap}
.sgc.gain{background:var(--gain-bg);box-shadow:inset 3px 0 0 var(--gain)} .sgc.loss{background:var(--loss-bg);box-shadow:inset 3px 0 0 var(--loss)} .sgc.pend{color:var(--muted)}
/* rounds */
.rlist{display:flex;flex-direction:column;gap:8px}
.rcard{display:grid;grid-template-columns:auto 1fr auto auto;gap:4px 12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 14px}
.rc-date{font-family:var(--font-d);font-weight:600;font-size:17px;text-transform:uppercase;letter-spacing:.04em;min-width:58px}
.rc-name{min-width:0;font-weight:500}
.rc-name small{display:block;color:var(--muted);font-weight:400;font-size:13px}
.rc-score{font-size:26px;line-height:1}
@media (max-width:520px){ .rcard{grid-template-columns:auto 1fr auto} .rc-date{grid-column:1 / -1;font-size:14px;color:var(--muted)} }
.rhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.rtitle{flex:1;min-width:140px;display:flex;flex-direction:column}
.rtitle span{font-size:13px;color:var(--muted)}
.rsum{display:flex;align-items:baseline;gap:8px}
.big{font-size:34px;line-height:1}
.strip{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.hb{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 0 5px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.hb i{font-style:normal;font-size:11px;color:var(--muted);line-height:1}
.hb b{font-size:17px;line-height:1;width:24px;height:24px;display:grid;place-items:center;border:1.5px solid transparent}
.hb.cur{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.hb.part b{color:var(--muted)}
.hb.s-1 b,.hb.s-2 b{border-color:var(--ink);border-radius:50%}
.hb.s-2 b{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--ink)}
.hb.s1 b,.hb.s2 b{border-color:var(--ink)}
.hb.s2 b{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--ink)}
.holehead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.holehead h2{font-size:28px;text-transform:uppercase;letter-spacing:.03em}
.holehead .meta{font-family:var(--font-d);font-size:19px;color:var(--ink2);font-weight:500}
.holehead .nav{margin-left:auto;display:flex;gap:6px}
.shots{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.shot{border-top:1px solid var(--line)}
.shot:first-child{border-top:0}
.shot-main{width:100%;background:none;border:0;display:grid;grid-template-columns:22px 12px minmax(0,1fr) auto;gap:8px;align-items:center;padding:9px 0;text-align:left}
.sn{color:var(--muted);font-size:16px}
.sl{min-width:0;display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline}
.sl b{font-family:var(--font-d);font-variant-numeric:tabular-nums;font-size:19px;font-weight:600}
.sl small{font-size:13px;color:var(--muted)}
.shot-ed{display:flex;flex-direction:column;gap:10px;padding:4px 0 12px}
.inline{flex-direction:row;align-items:center;gap:8px}
.inline input{width:90px}
.pad{border-color:var(--ink)}
.dist{display:flex;align-items:center;gap:10px}
.dist input{font-family:var(--font-d);font-size:30px;font-weight:600;width:120px;padding:4px 10px;text-align:center}
.dist span{color:var(--muted);font-size:14px}
.pad-last{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;border-top:1px dashed var(--line2);padding-top:10px}
.padhead{display:flex;flex-direction:column;gap:2px}
.padhead b{font-family:var(--font-d);font-size:22px;font-weight:600;letter-spacing:.01em}
ol.how,ul.how{margin:0;padding-left:20px;font-size:14px;color:var(--ink2);display:flex;flex-direction:column;gap:3px}
@media (max-width:460px){ .tab{font-size:13px;letter-spacing:.02em;padding-left:0;padding-right:0} }
.pbanner{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--flag);color:var(--flag-ink);border-radius:8px;padding:8px 12px;display:flex;gap:8px 12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.pbanner .btn{background:var(--flag-ink);color:var(--flag);border-color:var(--flag-ink)}
.rng{display:grid;grid-template-columns:170px minmax(0,1fr) 92px;gap:4px 12px;align-items:center;font-size:14px;color:var(--ink2)}
.rng input{width:100%;min-width:0;accent-color:var(--ink)}
.rng output{font-family:var(--font-d);font-size:20px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap}
@media (max-width:560px){ .rng{grid-template-columns:minmax(0,1fr) 92px} .rng span{grid-column:1 / -1} }
.eq{font-family:var(--font-d);font-size:21px;font-weight:500;color:var(--ink2);display:flex;flex-wrap:wrap;gap:4px 7px;align-items:center;font-variant-numeric:tabular-nums}
.eq b{font-weight:700;color:var(--ink)}
.sn-line{stroke:var(--ink2)}
#lab1-out,#lab3-out{display:flex;flex-direction:column;gap:12px;min-width:0}
.ablist{display:flex;flex-direction:column;min-width:0}
.abhead,.abrow{display:grid;grid-template-columns:40px minmax(96px,1fr) minmax(150px,1.4fr) 104px 92px 156px 104px 112px;gap:6px 10px;align-items:center}
.abhead{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:5px 0;border-bottom:1px solid var(--line2)}
.abhead .r,.ab-exp,.ab-sg{text-align:right}
.abrow{padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.abrow .cap,.ab-meta{display:none}
.abrow select,.abrow input{padding:5px 7px;width:100%;min-width:0}
.abrow input{text-align:right}
.ab-in{display:flex;align-items:center;gap:5px} .ab-in i{font-style:normal;color:var(--muted);flex:none}
.ab-na{color:var(--muted)}
.ab-exp{font-weight:500;font-size:16px}
@media (max-width:1000px){
  .abhead{display:none}
  .abrow{grid-template-columns:22px minmax(0,1fr) 86px 80px;grid-template-areas:"n from from sg" "fin fin left pen" "meta meta meta meta";padding:10px 0;gap:6px 8px}
  .ab-n{grid-area:n} .ab-from{grid-area:from;font-weight:600} .ab-sg{grid-area:sg} .ab-fin{grid-area:fin} .ab-left{grid-area:left} .ab-pen{grid-area:pen}
  .ab-exp,.ab-cat{display:none}
  .ab-meta{display:block;grid-area:meta;font-size:13px;color:var(--muted)}
  .abrow .cap{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin-bottom:3px}
  .ab-na{display:block;padding:5px 0}
}
.reflist{display:flex;flex-direction:column}
.refrow{display:grid;grid-template-columns:230px 150px minmax(0,1fr);gap:2px 14px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.refrow b{font-weight:600} .refrow span{color:var(--muted)} .refrow p{margin:0;color:var(--ink2)}
@media (max-width:700px){ .refrow{grid-template-columns:minmax(0,1fr) auto} .refrow p{grid-column:1 / -1} }
ol.best{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ol.best li{border-top:1px solid var(--line)}
ol.best li:first-child{border-top:0}
ol.best button{width:100%;background:none;border:0;display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;text-align:left}
.bl{min-width:0;display:flex;flex-wrap:wrap;gap:1px 8px;align-items:baseline}
.bl b{font-family:var(--font-d);font-size:19px;font-weight:600}
.bl small{flex-basis:100%;font-size:13px;color:var(--muted)}
.err{color:var(--loss);font-size:13px;font-weight:500}
.holed{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.holed .res{display:flex;align-items:baseline;gap:10px}
.plan{font-size:14px;color:var(--ink2);border-left:3px solid var(--flag);padding-left:9px}
/* bars */
.bars{display:flex;flex-direction:column;gap:6px}
.bar-row{display:grid;grid-template-columns:104px minmax(0,1fr) 54px;gap:8px;align-items:center;font-size:14px}
.bar-row.tot{border-top:1px solid var(--line);padding-top:7px;font-weight:600}
.bt{display:grid;grid-template-columns:1fr 1fr;height:16px;background:linear-gradient(var(--line2),var(--line2)) center/1px 100% no-repeat}
.bneg{display:flex;justify-content:flex-end} .bpos{display:flex}
.bneg i{background:var(--loss);border-radius:4px 0 0 4px;display:block;height:100%}
.bpos i{background:var(--gain);border-radius:0 4px 4px 0;display:block;height:100%}
.bv{text-align:right;font-size:17px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px}
.kv div{display:flex;flex-direction:column}
.kv b{font-family:var(--font-d);font-size:24px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.kv span{font-size:12px;color:var(--muted)}
.t5{display:flex;flex-direction:column;gap:4px;font-size:14px}
.t5 div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dotted var(--line2);padding-bottom:3px}
.leaks{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.leak{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.leak b{font-weight:600}
.leak span{font-size:13px;color:var(--ink2)}
.leak.l{box-shadow:inset 4px 0 0 var(--loss)} .leak.g{box-shadow:inset 4px 0 0 var(--gain)}
.twrap{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:right;padding:5px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:0}
td input{width:62px;padding:4px 6px;text-align:right}
td input.wide{width:120px;text-align:left}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.cols > *{min-width:0}
svg text{font-family:var(--font-b);font-size:11px;fill:var(--muted)}
.gsvg text{font-size:14px}
@media (max-width:520px){ th,td{padding-left:5px;padding-right:5px} th{letter-spacing:.02em} }
svg .ink{fill:var(--ink)} svg .halo{paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round;fill:var(--ink);font-weight:600}
.grid-l{stroke:var(--line);stroke-width:1} .zero-l{stroke:var(--line2);stroke-width:1}
.f-gain{fill:var(--gain)} .f-loss{fill:var(--loss)}
.f-fwy{fill:var(--z-fwy)} .f-rgh{fill:var(--z-rgh)} .f-snd{fill:var(--z-snd)} .f-rec{fill:var(--z-rec)} .f-grn{fill:var(--z-grn)} .f-pen{fill:var(--z-pen)} .f-ob{fill:var(--z-ob)}
.s1{stroke:var(--c1)} .s2{stroke:var(--c2)} .s3{stroke:var(--c3)} .m1{fill:var(--c1)} .m2{fill:var(--c2)} .m3{fill:var(--c3)}
.ln{fill:none;stroke-width:2;stroke-linejoin:round}
.mk{stroke:var(--surface);stroke-width:2}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink2)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.chartbox{position:relative;min-width:0}
.chartbox svg{display:block;width:100%;height:auto}
.tip{position:absolute;top:4px;right:4px;background:var(--surface);border:1px solid var(--line2);border-radius:6px;padding:5px 8px;font-size:12px;pointer-events:none;line-height:1.35}
.reco{font-size:16px;line-height:1.4}
.reco b{font-weight:600}
.holerow{border-top:1px solid var(--line)}
.holerow:first-child{border-top:0}
.holerow > button{width:100%;background:none;border:0;display:grid;grid-template-columns:30px 64px 62px minmax(0,1fr) auto;gap:8px;align-items:center;text-align:left;padding:10px 0}
.holerow .hn{font-size:22px}
